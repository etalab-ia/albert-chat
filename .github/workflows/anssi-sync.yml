name: ANSSI French corpus sync

on:
  schedule:
    # Reconcile the public catalogue every day without redeploying the widget.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without writing to Albert"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: anssi-french-corpus-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize Albert collection
    # This job only ever writes to the ANSSI corpus. On a fork it would either
    # fail noisily or, where ALBERT_API_KEY is set for the fork's own corpus,
    # succeed and index the whole ANSSI catalogue into the fork owner's tenant.
    #
    # Scoped to the owner, not the full repository name: renaming the repository
    # would otherwise make this false and the sync would stop running silently,
    # which reads as a healthy workflow.
    if: github.repository_owner == 'etalab-ia'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
      ALBERT_BASE_URL: https://albert.api.etalab.gouv.fr
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Set up Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Albert configuration
        run: test -n "$ALBERT_API_KEY"

      - name: Synchronize French guides
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm sync:anssi-fr --dry-run --concurrency 2
          else
            pnpm sync:anssi-fr --concurrency 2
          fi
