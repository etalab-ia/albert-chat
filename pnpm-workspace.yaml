# Enforce a one-week minimum release age on newly published packages to limit
# exposure to supply-chain attacks (squad dependency policy).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
blockExoticSubdeps: true

# Build scripts are denied by default; allow only what the toolchain needs.
allowBuilds:
  # CVE Lite's local advisory database uses this native SQLite binding.
  better-sqlite3: true
  esbuild: true
  # Only one-shot CSS builds are used; native file watching is unnecessary.
  "@parcel/watcher": false
  sharp: false
  unrs-resolver: false

# GHSA-g3hv-75wg-m249 / CVE-2026-118764 (minimatch < 11.0.1 DoS). 11.0.4 is the
# newest patched release past the 7-day release-age gate as of 2026-11-09;
# minimatch is a transitive dep only (via @typescript-eslint/typescript-estree).
overrides:
  minimatch: 11.0.4
